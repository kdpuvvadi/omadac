name: Build docker image
on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: kdpuvvadi/omadac
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=OmadaC
            org.opencontainers.image.description=Deploy Omada Controller
            org.opencontainers.image.name=kdpuvvadi/omadac
            org.opencontainers.image.authors=kdpuvvadi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into docker
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push to registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
